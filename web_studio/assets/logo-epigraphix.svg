<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="epiRingGrad" x1="12" y1="12" x2="148" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="28%" stop-color="#a855f7"/>
      <stop offset="56%" stop-color="#fb7185"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="epiLeafGrad" x1="28" y1="66" x2="132" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="epiStylusGrad" x1="48" y1="24" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="epiCoreBg" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#131a38"/>
      <stop offset="100%" stop-color="#091f2c"/>
    </linearGradient>
    <radialGradient id="epiAura" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Prismatic Precision Ring -->
  <circle cx="80" cy="80" r="74" fill="url(#epiCoreBg)" stroke="url(#epiRingGrad)" stroke-width="3.5"/>
  <circle cx="80" cy="80" r="66" fill="url(#epiAura)" stroke="url(#epiRingGrad)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- Cardinal Compass & Optical Calibration Ticks -->
  <g stroke="url(#epiRingGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="10" x2="80" y2="19"/>
    <line x1="80" y1="141" x2="80" y2="150"/>
    <line x1="10" y1="80" x2="19" y2="80"/>
    <line x1="141" y1="80" x2="150" y2="80"/>
  </g>

  <!-- Neural Constellation Arcs Above Manuscript -->
  <path d="M40 56 C56 34, 104 34, 120 56" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.85"/>
  <path d="M48 52 C68 40, 92 40, 112 52" stroke="#c084fc" stroke-width="1.4" opacity="0.8"/>
  <circle cx="48" cy="52" r="3.2" fill="#22d3ee"/>
  <circle cx="80" cy="38" r="4" fill="#fbbf24"/>
  <circle cx="112" cy="52" r="3.2" fill="#fb7185"/>
  <circle cx="64" cy="43" r="2.6" fill="#34d399"/>
  <circle cx="96" cy="43" r="2.6" fill="#a855f7"/>

  <!-- Thaliyola Palm-Leaf Manuscript Plaque -->
  <path d="M24 84 C32 69, 52 65, 80 65 C108 65, 128 69, 136 84 C128 99, 108 103, 80 103 C52 103, 32 99, 24 84 Z"
        fill="url(#epiLeafGrad)" stroke="#fef08a" stroke-width="1.8"/>
  <!-- Palm-Leaf Striation Lines & Twin Cord Holes -->
  <line x1="36" y1="78" x2="124" y2="78" stroke="#78350f" stroke-width="1.1" stroke-opacity="0.45"/>
  <line x1="34" y1="84" x2="126" y2="84" stroke="#78350f" stroke-width="1.1" stroke-opacity="0.45"/>
  <line x1="36" y1="90" x2="124" y2="90" stroke="#78350f" stroke-width="1.1" stroke-opacity="0.45"/>
  <circle cx="50" cy="84" r="4.2" fill="#0b132b" stroke="#fef08a" stroke-width="1.4"/>
  <circle cx="110" cy="84" r="4.2" fill="#0b132b" stroke="#fef08a" stroke-width="1.4"/>

  <!-- Stylized Grantha / Malayalam Curved Glyph Wave on Leaf -->
  <path d="M61 88 C61 78, 70 76, 72 84 C74 91, 81 90, 82 82 C83 75, 92 76, 94 85 C95 90, 100 88, 101 81"
        stroke="#0b132b" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Holographic Laser Scan Plane -->
  <line x1="28" y1="84" x2="132" y2="84" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.9"/>

  <!-- Ornate Golden Ezhuthani Iron Stylus Engraving the Leaf -->
  <g>
    <path d="M114 28 L122 35 L79 86 L72 91 L74 82 Z" fill="url(#epiStylusGrad)" stroke="#ffffff" stroke-width="1"/>
    <circle cx="118" cy="31.5" r="5.2" fill="#fbbf24" stroke="#ffffff" stroke-width="1.3"/>
    <!-- Glowing Incision Spark at Stylus Tip -->
    <circle cx="72.5" cy="90.5" r="4.5" fill="#22d3ee"/>
    <circle cx="72.5" cy="90.5" r="8.5" stroke="#22d3ee" stroke-width="1.2" opacity="0.65"/>
  </g>

  <!-- Lower Optical Prism Arc -->
  <path d="M44 116 Q80 134 116 116" stroke="url(#epiRingGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="80" cy="125" r="3.4" fill="#34d399"/>
</svg>
